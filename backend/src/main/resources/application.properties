server.port=${PORT:8080}
spring.application.name=traffic-swarm-backend

# PostgreSQL - Supabase Configuration
spring.datasource.url=${postgresql://postgres.avpmzoabxymyvsdoilae:postgres@aws-0-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${postgres.avpmzoabxymyvsdoilae}
spring.datasource.password=${postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# Actuator
management.endpoints.web.exposure.include=health,info

# SQL Initialization
spring.sql.init.mode=never

# Traffic Swarm Configuration
tsi.experiment.python=${TSI_EXPERIMENT_PYTHON:python}
tsi.experiment.root=${TSI_EXPERIMENT_ROOT:../}
tsi.web.allowed-origins=${TSI_WEB_ALLOWED_ORIGINS:http://localhost:3000}
tsi.gateway.secret=${TSI_GATEWAY_SECRET:}
tsi.experiment.timeout-seconds=${TSI_EXPERIMENT_TIMEOUT_SECONDS:7200}